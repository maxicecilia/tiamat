<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiamat</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      ;(() => {
        const saved = localStorage.getItem('tiamat-theme')
        const t = ['light', 'dark', 'system'].includes(saved) ? saved : 'dark'
        const legacy = { classic: 'boring', hoard: 'tiamat', heads: 'tiamat' }
        const saved = localStorage.getItem('tiamat-skin')
        const skin = ['boring', 'phosphor', 'gibson', 'tiamat'].includes(saved) ? saved : legacy[saved] || 'boring'
        const dark = skin !== 'boring' || t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.dataset.skin = skin
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
